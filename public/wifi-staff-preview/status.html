<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0c0d">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta http-equiv="refresh" content="$(refresh-timeout-secs)">
<title>Estado de sesión</title>
<link rel="stylesheet" href="/wifi-staff-preview/styles.css">
<link rel="stylesheet" href="/wifi-staff-preview/staff.css">
</head>
<body><!-- DEMO ONLY; no RouterOS authentication or external requests -->
<main class="card">
  <img class="logo" src="/wifi-staff-preview/assets/lbbs-logo.svg" alt="LBBS">
  <p class="eyebrow">Acceso Staff</p>

  <span class="pill">Conectado</span>

  <dl>
    <div class="r"><dt>Documento</dt><dd>Empleado Staff (ejemplo)</dd></div>

    <div class="r"><dt>Tiempo conectado</dt><dd>00:18:32</dd></div>

    <div class="r"><dt>Descargado</dt><dd>128 MB</dd></div>
    <div class="r"><dt>Subido</dt><dd>24 MB</dd></div>
  </dl>

  <a class="button" href="/wifi-staff-preview/status.html">Continuar navegando</a>

  <form class="inline" action="/wifi-staff-preview/logout.html" method="post">
    <button class="secondary danger" type="submit">Cerrar sesión</button>
  </form>
  <p class="brand-foot">La Bajadita Barber Studio</p>
</main>
</body>
</html>
