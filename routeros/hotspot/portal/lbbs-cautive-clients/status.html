<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0c0d">
<title>LBBS WiFi</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="card">
  <img class="logo" src="assets/lbbs-logo.svg" alt="LBBS">
  <p class="eyebrow">WiFi para clientes</p>
  <div class="badge ok" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </div>
  <h1>Conectado</h1>
  <p>Ya puedes navegar por Internet.</p>
  <dl>
    <div><dt>IP</dt><dd>$(ip)</dd></div>
    <div><dt>Tiempo conectado</dt><dd>$(uptime)</dd></div>
    <div><dt>Datos recibidos</dt><dd>$(bytes-in-nice)</dd></div>
    <div><dt>Datos enviados</dt><dd>$(bytes-out-nice)</dd></div>
    <div><dt>Tiempo de sesión</dt><dd>$(session-time-left)</dd></div>
  </dl>
  <a class="button secondary" href="$(link-logout)">Cerrar conexión</a>
  <p class="brand-foot">La Bajadita Barber Studio</p>
</main>
</body>
</html>
