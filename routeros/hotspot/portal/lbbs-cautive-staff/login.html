<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Acceso Staff</title>
<style>
:root{--bg:#0f1419;--card:#171d25;--line:#263040;--text:#e8edf3;--muted:#8a97a8;--accent:#2dd4bf;--accent-ink:#06201c;--danger:#f87171;--ok:#4ade80;--radius:14px;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font)}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}
input,select{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:120px 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn[disabled]{opacity:.7;cursor:wait}
.alert{background:rgba(248,113,113,.12);border:1px solid var(--danger);color:var(--danger);padding:11px 13px;border-radius:10px;font-size:14px;margin-bottom:6px}
.spin{width:16px;height:16px;border:2px solid var(--accent-ink);border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;display:none}
.btn[disabled] .spin{display:inline-block}
@keyframes r{to{transform:rotate(360deg)}}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <div class="logo">S</div>
    <div><h1>Acceso Staff</h1><p class="sub">Red interna · solo personal autorizado</p></div>
  </div>

  $(if error)<div class="alert">$(error)</div>$(endif)
  <div class="alert" id="clientError" style="display:none"></div>

  <form name="login" action="$(link-login-only)" method="post" onsubmit="return doLogin()" autocomplete="off">
    <input type="hidden" name="username" value="">
    <input type="hidden" name="dst" value="$(link-orig)">

    <label for="dtype">Documento de identidad</label>
    <div class="row">
      <select id="dtype">
        <option value="dni">DNI</option>
        <option value="cex">CEX</option>
        <option value="pas">Pasaporte</option>
      </select>
      <input id="doc" type="text" inputmode="text" autocapitalize="characters" placeholder="Número" required>
    </div>
    <div class="hint" id="dhint">8 dígitos</div>

    <label for="pwd">Contraseña</label>
    <input id="pwd" name="password" type="password" placeholder="••••••••" required>

    <button class="btn" id="go" type="submit"><span class="spin"></span><span id="gotxt">Conectar</span></button>
  </form>

  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" style="display:none">
    <input type="hidden" name="username">
    <input type="hidden" name="password">
    <input type="hidden" name="dst" value="$(link-orig)">
  </form>
  <script src="/md5.js"></script>
  $(endif)

  <p class="foot">¿Problemas para ingresar? Consulta con administración.</p>
</main>

<script>
var RULES={
  dni:{re:/^\d{8}$/,hint:"8 dígitos",msg:"El DNI debe tener 8 dígitos."},
  cex:{re:/^[A-Z0-9]{9,12}$/,hint:"9 a 12 caracteres (letras y números)",msg:"El CEX debe tener entre 9 y 12 caracteres."},
  pas:{re:/^[A-Z0-9]{6,12}$/,hint:"6 a 12 caracteres (letras y números)",msg:"El pasaporte debe tener entre 6 y 12 caracteres."}
};
var sel=document.getElementById('dtype'),doc=document.getElementById('doc'),
    hint=document.getElementById('dhint'),ce=document.getElementById('clientError');
sel.onchange=function(){hint.textContent=RULES[sel.value].hint;doc.value='';ce.style.display='none';doc.inputMode=sel.value==='dni'?'numeric':'text';doc.focus();};
doc.inputMode='numeric';
function showErr(m){ce.textContent=m;ce.style.display='block';}
function doLogin(){
  var r=RULES[sel.value],v=doc.value.replace(/\s+/g,'').toUpperCase(),p=document.getElementById('pwd').value;
  if(!r.re.test(v)){showErr(r.msg);return false;}
  if(!p){showErr('Ingresa tu contraseña.');return false;}
  ce.style.display='none';
  document.login.username.value=v;
  var b=document.getElementById('go');b.disabled=true;document.getElementById('gotxt').textContent='Verificando…';
  $(if chap-id)
  document.sendin.username.value=v;
  document.sendin.password.value=hexMD5('$(chap-id)'+p+'$(chap-challenge)');
  document.sendin.submit();
  return false;
  $(endif)
  return true;
}
</script>
</body>
</html>
