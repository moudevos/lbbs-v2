<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0c0d">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>No se pudo conectar</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="staff.css">
</head>
<body>
<main class="card">
  <img class="logo" src="assets/lbbs-logo.svg" alt="LBBS">
  <p class="eyebrow">Acceso Staff</p>
  <div class="badge err" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>
  <h1>No se pudo conectar</h1>
  <p>Ocurrió un problema al validar tu acceso.</p>

  <div class="alert">$(error)</div>

  <a class="button" href="$(link-login)">Volver a intentar</a>
  <p class="hint">Si el problema continúa, consulta con administración.</p>
  <p class="brand-foot">La Bajadita Barber Studio</p>
</main>
</body>
</html>
