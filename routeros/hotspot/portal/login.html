<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LBBS WiFi</title><link rel="stylesheet" href="styles.css"><script src="md5.js"></script></head><body><main class="card"><img class="logo" src="assets/lbbs-logo.svg" alt="LBBS"><p class="eyebrow">WiFi para clientes</p><h1>Conéctate a LBBS</h1><form id="identify"><label>DNI<input id="dni" inputmode="numeric" maxlength="8" required></label><label>Código de acceso<input id="code" inputmode="numeric" maxlength="6" required></label><button>CONTINUAR</button><p class="hint">Solicita tu código de 6 dígitos en recepción.</p></form><form id="register" hidden><label>DNI<input id="registrationDni" readonly></label><label>Nombres<input id="firstName" required></label><label>Apellidos<input id="lastName" required></label><label>Correo electrónico (opcional)<input id="email" type="email" autocomplete="email"></label><label>Fecha de cumpleaños (opcional)<input id="birthdate" type="date"></label><label class="check"><input id="privacy" type="checkbox" required> Acepto la <a data-legal="privacidad" target="_blank" rel="noopener">Política de Privacidad</a>, los <a data-legal="terminos-wifi" target="_blank" rel="noopener">Términos WiFi</a> y la <a data-legal="cookies" target="_blank" rel="noopener">Política de Cookies</a>.</label><label class="check"><input id="clubMarketing" type="checkbox"> Quiero recibir novedades y beneficios de <a data-legal="club" target="_blank" rel="noopener">La Bajadita Club</a>.</label><button>REGISTRARME Y CONECTAR</button></form><p id="notice" class="notice" aria-live="polite"></p>$(if chap-id)<form id="chap" action="$(link-login-only)" method="post" hidden><input name="username"><input name="password"><input name="dst" value="$(link-orig)"><input name="popup" value="true"></form>$(endif)</main><script>
(function(){var api='{{LBBS_API_BASE_URL}}',legalBase='https://{{LBBS_LEGAL_HOST}}/legal',router='{{LBBS_ROUTER_IDENTIFIER}}',dni=document.getElementById('dni'),code=document.getElementById('code'),note=document.getElementById('notice'),registrationToken='';document.querySelectorAll('[data-legal]').forEach(function(link){link.href=legalBase+'/'+link.getAttribute('data-legal')});
function say(t){note.textContent=t} function post(path,data){return fetch(api+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw Error(j.error||'No pudimos completar el acceso.');return j})})}
dni.oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,8)};code.oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,6)};
function login(){var f=document.getElementById('chap');if(!f){say('Este router no tiene CHAP habilitado.');return}f.username.value=code.value;f.password.value=hexMD5('$(chap-id)'+code.value+'$(chap-challenge)');f.submit()}
function wait(token){var n=0;var timer=setInterval(function(){n++;post('/api/hotspots/captive/status',{claimToken:token}).then(function(x){if(x.status==='activation_ready'){clearInterval(timer);say('Conectando...');login()}else if(x.status==='expired'||x.status==='revoked'){clearInterval(timer);say('El acceso ha expirado.')}}).catch(function(){if(n>=20){clearInterval(timer);say('No pudimos preparar tu conexión.')}});if(n>=20){clearInterval(timer);say('La activación está demorando. Intenta nuevamente.')}},1000)}
document.getElementById('identify').onsubmit=function(e){e.preventDefault();if(!/^\d{8}$/.test(dni.value)||!/^\d{6}$/.test(code.value)){say('Revisa tu DNI y código de acceso.');return}say('Estamos preparando tu conexión...');post('/api/hotspots/captive/identify',{dni:dni.value,code:code.value,mac:'$(mac)',ip:'$(ip)',routerIdentifier:router}).then(function(x){if(x.status==='registration_required'){registrationToken=x.registrationToken;document.getElementById('registrationDni').value=dni.value;document.getElementById('identify').hidden=true;document.getElementById('register').hidden=false;say('Completa solo estos datos para continuar.')}else{say('Hola, '+x.firstName+'. Estamos preparando tu conexión...');wait(x.claimToken)}}).catch(function(e){say(e.message)})};
document.getElementById('register').onsubmit=function(e){e.preventDefault();say('Estamos preparando tu conexión...');post('/api/hotspots/captive/register',{registrationToken:registrationToken,firstName:document.getElementById('firstName').value,lastName:document.getElementById('lastName').value,email:document.getElementById('email').value,birthdate:document.getElementById('birthdate').value,privacyAccepted:document.getElementById('privacy').checked,clubMarketingAccepted:document.getElementById('clubMarketing').checked}).then(function(x){say('Hola, '+x.firstName+'. Ya formas parte de nuestros clientes. Estamos preparando tu conexión...');wait(x.claimToken)}).catch(function(e){say(e.message)})};}());
</script></body></html>
