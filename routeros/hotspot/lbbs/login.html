<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LBBS WiFi</title><link rel="stylesheet" href="styles.css"><script src="md5.js"></script></head><body><main><h1>LBBS</h1><h2>WiFi para clientes</h2><p>Identifícate para conectarte.</p><form id="identify"><label>DNI<input name="dni" inputmode="numeric" maxlength="8" required></label><label>Código de acceso<input name="code" inputmode="numeric" maxlength="6" required></label><button>CONTINUAR</button><small>Código proporcionado en recepción. Acceso válido para un dispositivo.</small></form><form id="register" hidden><h2>Únete a La Bajadita</h2><label>DNI<input id="rdni" readonly></label><label>Nombres<input name="firstName" required></label><label>Apellidos<input name="lastName" required></label><label>Celular<input name="phone" required></label><label>Correo<input name="email" type="email"></label><label><input name="privacy" type="checkbox" required>Acepto el registro de mis datos para identificación y atención como cliente de La Bajadita.</label><button>REGISTRARME Y CONECTAR</button></form><section id="message" aria-live="polite"></section><form id="router-login" action="$(link-login-only)" method="post" hidden><input name="username"><input name="password"><input name="dst" value="$(link-orig)"><input name="popup" value="true"></form></main><script>
const api='https://{{LBBS_PUBLIC_DOMAIN}}/api/hotspots/captive/',msg=document.querySelector('#message'),identify=document.querySelector('#identify'),register=document.querySelector('#register');let claim,code,dni;
async function request(path,data){const r=await fetch(api+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'No pudimos completar el acceso. Inténtalo nuevamente.');return j}
function wait(){msg.textContent='Estamos preparando tu conexión…';const t=setInterval(async()=>{try{const s=await request('status',{claimToken:claim});if(s.status==='activation_ready'){clearInterval(t);const f=document.querySelector('#router-login');f.username.value=code;f.password.value=hexMD5('$(chap-id)'+code+'$(chap-challenge)');f.submit()}if(['sync_error','expired','revoked'].includes(s.status)){clearInterval(t);msg.textContent='Estamos teniendo problemas para habilitar la conexión. Solicita ayuda en recepción.'}}catch{clearInterval(t);msg.textContent='No pudimos completar el acceso. Inténtalo nuevamente.'}},3000)}
identify.onsubmit=async e=>{e.preventDefault();dni=e.target.dni.value.replace(/\D/g,'');code=e.target.code.value.replace(/\D/g,'');try{const r=await request('identify',{dni,code,mac:'$(mac)',ip:'$(ip)',routerIdentifier:'{{ROUTER_IDENTIFIER}}'});if(r.status==='registration_required'){identify.hidden=true;register.hidden=false;document.querySelector('#rdni').value=dni;window.registrationToken=r.registrationToken;msg.textContent='Aún no encontramos tu registro. Completa tus datos para unirte a La Bajadita y conectarte.'}else{claim=r.claimToken;msg.textContent='Hola, '+r.firstName+'. Ya eres miembro PREMIUM de La Bajadita. Disfruta tu estadía.';wait()}}catch(x){msg.textContent=x.message}};
register.onsubmit=async e=>{e.preventDefault();try{const r=await request('register',{registrationToken:window.registrationToken,firstName:e.target.firstName.value,lastName:e.target.lastName.value,phone:e.target.phone.value,email:e.target.email.value,privacyAccepted:e.target.privacy.checked});claim=r.claimToken;msg.textContent='¡Bienvenido, '+r.firstName+'! Ya eres miembro PREMIUM de La Bajadita.';wait()}catch(x){msg.textContent=x.message}};
</script></body></html>
